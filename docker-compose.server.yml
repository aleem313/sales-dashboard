# ============================================
# Contabo deployment — nginx + Let's Encrypt HTTPS
# ============================================
# The app is fronted by nginx (ports 80/443) terminating TLS for
# risinglions.ikonicsolution.com. Certbot renews the cert via webroot.
#
# Data volumes (pgdata_server, uploads_data) are preserved from the original
# HTTP-only stack — do NOT rename them or the live DB / attachments are lost.
# The cert lives on the host at /etc/letsencrypt (issued via certbot standalone)
# and is bind-mounted read-only into nginx.
#
# Usage (on the server):
#   docker compose --env-file .env.production -f docker-compose.server.yml up -d --build
#
# .env.production must set AUTH_URL=https://risinglions.ikonicsolution.com
# and AUTH_TRUST_HOST=true so NextAuth works behind the proxy.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - UPLOADS_DIR=/var/lib/sales-dashboard/uploads
    env_file:
      - .env.production
    volumes:
      - uploads_data:/var/lib/sales-dashboard/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - server-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - app
    restart: always
    networks:
      - server-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - server-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8"
    volumes:
      - pgdata_server:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - server-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata_server:
  uploads_data:
  certbot-webroot:

networks:
  server-net:
    driver: bridge
