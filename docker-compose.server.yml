# ============================================
# Contabo HTTP-only deployment (no nginx, no SSL)
# ============================================
# Lean variant of docker-compose.prod.yml for bringing the app up quickly
# on a plain IP (e.g. 157.173.110.62) before a domain + Let's Encrypt are
# configured. Publishes the Next.js app directly on host port 80.
#
# Usage (on the server):
#   cp .env.server.example .env.production
#   # edit .env.production with real secrets
#   docker compose -f docker-compose.server.yml up -d --build
#
# Upgrade path: once you have a domain + certs, switch to
#   docker compose -f docker-compose.prod.yml up -d
# which wraps the app in nginx + certbot.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - UPLOADS_DIR=/var/lib/sales-dashboard/uploads
    env_file:
      - .env.production
    volumes:
      - uploads_data:/var/lib/sales-dashboard/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - server-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8"
    volumes:
      - pgdata_server:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - server-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata_server:
  uploads_data:

networks:
  server-net:
    driver: bridge
