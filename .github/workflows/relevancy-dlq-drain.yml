name: Relevancy DLQ Drain

# Hourly drain of relevancy_scores_dlq — re-attempts failed audit-log writes
# parked by the classifier's C11 DLQ fallback (plan v3.3 Appendix C).
#
# Required repo secrets:
#   CRON_SECRET — re-used from the existing /api/migrate route. Bearer token.
#
# The endpoint /api/cron/relevancy-dlq-drain:
#   • SELECTs up to 50 ready-to-retry rows with FOR UPDATE SKIP LOCKED so
#     overlapping runs (cron + manual dispatch) never touch the same row.
#   • Replays each payload through insertRelevancyScore inside the same tx.
#   • On failure, bumps attempts + exponentially backs off next_attempt_at
#     (1h, 2h, 4h, 8h, 16h). After 5 attempts the row is permanent.
#   • Returns {retried, succeeded, failed, permanent, pending_after_run}.

on:
  schedule:
    # 7 minutes past every hour — offset to avoid the top-of-hour stampede.
    - cron: "7 * * * *"
  workflow_dispatch:

# Hourly job is idempotent (SKIP LOCKED), but no point queueing — cancel any
# in-flight run if a new one starts.
concurrency:
  group: relevancy-dlq-drain
  cancel-in-progress: true

jobs:
  drain:
    name: Drain DLQ
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit drain endpoint
        run: |
          set -euo pipefail
          response=$(curl -X POST \
               -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
               -H "Content-Type: application/json" \
               -sSf \
               --retry 3 \
               --retry-delay 5 \
               --max-time 60 \
               http://157.173.110.62/api/cron/relevancy-dlq-drain)
          echo "$response" | jq .
          # Surface non-zero pending depth in the run summary so failures are
          # visible without digging into logs.
          pending=$(echo "$response" | jq -r '.pending_after_run // 0')
          echo "## DLQ depth after run: $pending" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$response" | jq . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
