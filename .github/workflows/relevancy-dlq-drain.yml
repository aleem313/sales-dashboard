name: Relevancy DLQ Drain

# Hourly drain of relevancy_scores_dlq — re-attempts failed audit-log writes
# parked by the classifier's C11 DLQ fallback (plan v3.3 Appendix C).
#
# Required repo secrets:
#   CRON_SECRET — re-used from the existing /api/migrate route. Bearer token.
#
# The endpoint /api/cron/relevancy-dlq-drain:
#   • SELECTs up to 50 ready-to-retry rows with FOR UPDATE SKIP LOCKED so
#     overlapping runs (cron + manual dispatch) never touch the same row.
#   • Replays each payload through insertRelevancyScore inside the same tx.
#   • On failure, bumps attempts + exponentially backs off next_attempt_at
#     (1h, 2h, 4h, 8h, 16h). After 5 attempts the row is permanent.
#   • Returns {retried, succeeded, failed, permanent, pending_after_run}.

on:
  schedule:
    # 7 minutes past every hour — offset to avoid the top-of-hour stampede.
    - cron: "7 * * * *"
  workflow_dispatch:

# Hourly job is idempotent (SKIP LOCKED), but no point queueing — cancel any
# in-flight run if a new one starts.
concurrency:
  group: relevancy-dlq-drain
  cancel-in-progress: true

jobs:
  drain:
    name: Drain DLQ
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit drain endpoint
        run: |
          set -euo pipefail
          # We deliberately DON'T pass -f / --fail-with-body / -sS here — we
          # want the response body on BOTH success AND error (so 5xx surfaces
          # the error detail instead of being silently swallowed). The HTTP
          # status code is captured separately via -w and we fail the step
          # explicitly below if it isn't 2xx.
          tmp_body=$(mktemp)
          status=$(curl -X POST \
               -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
               -H "Content-Type: application/json" \
               -s \
               --retry 3 \
               --retry-delay 5 \
               --max-time 60 \
               -o "$tmp_body" \
               -w "%{http_code}" \
               http://157.173.110.62/api/cron/relevancy-dlq-drain)
          body=$(cat "$tmp_body")
          rm -f "$tmp_body"
          echo "HTTP $status"
          echo "$body" | jq . || echo "$body"
          # Always surface what we got in the run summary, regardless of status.
          echo "## DLQ drain — HTTP $status" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$body" | jq . >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "$body" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != "200" ]; then
            echo "::error::Drain endpoint returned HTTP $status"
            exit 1
          fi
          pending=$(echo "$body" | jq -r '.pending_after_run // 0')
          echo "DLQ depth after run: $pending"
