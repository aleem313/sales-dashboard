name: Build & Deploy

on:
  push:
    branches:
      - main        # → Production server
      - staging     # → Staging/local server
  pull_request:
    branches:
      - main        # → Build check only (no deploy)
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

# Cancel in-progress deployments for the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────
  # Job 1: Lint, type-check, and build
  # ──────────────────────────────────────────
  build-check:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build
        env:
          # Add any NEXT_PUBLIC_* vars needed at build time
          NEXT_TELEMETRY_DISABLED: 1

  # ──────────────────────────────────────────
  # Job 2: Build and push Docker image
  # ──────────────────────────────────────────
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # Job 3: Deploy to production server
  # ──────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://${{ secrets.PROD_DOMAIN }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=== Deploying to production ==="
            cd ${{ secrets.PROD_DEPLOY_PATH || '/opt/sales-dashboard' }}

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Write environment file from secret
            echo "${{ secrets.PROD_ENV_FILE }}" | base64 -d > .env.production

            # Login to GHCR and pull the new image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull app

            # Restart with new image
            docker compose -f docker-compose.prod.yml up -d

            # Wait for app to be healthy
            echo "Waiting for health check..."
            sleep 10
            RETRIES=6
            for i in $(seq 1 $RETRIES); do
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "Health check passed!"
                break
              fi
              if [ "$i" -eq "$RETRIES" ]; then
                echo "ERROR: Health check failed after $RETRIES attempts"
                echo "Rolling back..."
                docker compose -f docker-compose.prod.yml logs --tail=50 app
                exit 1
              fi
              echo "Attempt $i/$RETRIES failed, retrying in 10s..."
              sleep 10
            done

            # Cleanup old images
            docker image prune -f
            echo "=== Deployment complete ==="

      - name: Notify success
        if: success() && secrets.SLACK_DEPLOY_WEBHOOK != ''
        run: |
          curl -X POST "${{ secrets.SLACK_DEPLOY_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"✅ Production deployed: \`${{ github.sha }}\` by ${{ github.actor }}\"}"

      - name: Notify failure
        if: failure() && secrets.SLACK_DEPLOY_WEBHOOK != ''
        run: |
          curl -X POST "${{ secrets.SLACK_DEPLOY_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"❌ Production deploy FAILED: \`${{ github.sha }}\` by ${{ github.actor }}\"}"

  # ──────────────────────────────────────────
  # Job 4: Deploy to staging server
  # ──────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: |
      (github.ref == 'refs/heads/staging' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://${{ secrets.STAGING_DOMAIN }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=== Deploying to staging ==="
            cd ${{ secrets.STAGING_DEPLOY_PATH || '/opt/sales-dashboard' }}

            git fetch origin staging
            git reset --hard origin/staging

            echo "${{ secrets.STAGING_ENV_FILE }}" | base64 -d > .env.production

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull app

            docker compose -f docker-compose.prod.yml up -d

            echo "Waiting for health check..."
            sleep 10
            RETRIES=6
            for i in $(seq 1 $RETRIES); do
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "Health check passed!"
                break
              fi
              if [ "$i" -eq "$RETRIES" ]; then
                echo "ERROR: Health check failed"
                docker compose -f docker-compose.prod.yml logs --tail=50 app
                exit 1
              fi
              echo "Attempt $i/$RETRIES failed, retrying in 10s..."
              sleep 10
            done

            docker image prune -f
            echo "=== Staging deployment complete ==="
